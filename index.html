<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <style>
        /* 全体の背景を本物っぽいダークモード風（ディープネイビー）に */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #131314; 
            color: #e3e3e3;
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        
        /* ヘッダー */
        header {
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 500;
            color: #e3e3e3;
            border-bottom: 1px solid #2e2f30;
        }

        /* チャット表示エリア */
        #chat-box { 
            flex: 1; 
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px; 
            overflow-y: auto; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* メッセージの枠 */
        .msg { 
            margin: 15px 0; 
            padding: 12px 18px; 
            border-radius: 18px; 
            max-width: 85%; 
            line-height: 1.6;
            font-size: 15px;
        }

        /* ユーザーの発言（右側・薄いグレーの枠） */
        .user { 
            background: #2e2f30; 
            color: #fff;
            align-self: flex-end; 
            margin-left: auto; 
            border-bottom-right-radius: 4px;
        }

        /* Geminiの発言（左側・枠なしでアイコン付き風） */
        .ai { 
            background: transparent; 
            align-self: flex-start; 
            padding-left: 40px;
            position: relative;
        }

        /* Geminiのキラキラアイコンを疑似的に再現 */
        .ai::before {
            content: "✨";
            position: absolute;
            left: 10px;
            top: 12px;
            font-size: 18px;
        }

        /* 入力エリアのコンテナ */
        .input-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 25px 20px;
            box-sizing: border-box;
        }

        /* 本物風の丸い入力ボックス */
        #input-area { 
            display: flex; 
            align-items: center;
            background: #1e1f20;
            border-radius: 28px;
            padding: 6px 16px;
            border: 1px solid transparent;
        }
        #input-area:focus-within {
            background: #28292a;
        }

        /* 入力欄本体 */
        input { 
            flex: 1; 
            background: transparent;
            border: none;
            color: #e3e3e3;
            padding: 12px; 
            font-size: 16px;
            outline: none;
        }
        input::placeholder {
            color: #80868b;
        }

        /* 送信ボタン（右側のアイコン風） */
        button { 
            background: transparent;
            border: none;
            color: #a8c7fa;
            font-size: 20px;
            cursor: pointer; 
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover {
            background: #2e2f30;
        }
    </style>
</head>
<body>

    <header>✨ Gemini</header>
    <div id="chat-box">
        <!-- 最初のアナウンス -->
        <div class="msg ai"><b>Gemini:</b> 今日はどのような用件でしょうか？</div>
    </div>
    
    <div class="input-container">
        <div id="input-area">
            <input type="text" id="user-input" placeholder="ここにプロンプトを入力してください" onkeypress="if(event.key==='Enter') sendToGemini()">
            <button onclick="sendToGemini()">➤</button>
        </div>
    </div>

    <script>
        // ⚠️ ここに取得したGeminiのAPIキーを貼り付けてください
        const API_KEY = 'ここにあなたのAPIキーを貼り付ける';
        const API_URL = `https://googleapis.com{API_KEY}`;

        let chatHistory = [];

        async function sendToGemini() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const prompt = inputField.value.trim();
            
            if (!prompt) return;

            // 1. ユーザーのメッセージを表示
            chatBox.innerHTML += `<div class="msg user">${prompt}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // AIの返答待ち表示
            const aiMsgId = 'ai-' + Date.now();
            chatBox.innerHTML += `<div class="msg ai" id="${aiMsgId}">考え中...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            chatHistory.push({
                role: "user",
                parts: [{ text: prompt }]
            });

            // 2. API送信
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text; // バグ防止のためデータ構造の指定を少し厳密に直しました

                // 3. 画面書き換え
                document.getElementById(aiMsgId).innerHTML = `${reply.replace(/\n/g, '<br>')}`;

                chatHistory.push({
                    role: "model",
                    parts: [{ text: reply }]
                });

            } catch (error) {
                document.getElementById(aiMsgId).innerHTML = `<span style="color: #ecc9c9;">エラーが発生しました。学校のWi-FiでAPI通信自体がブロックされている可能性があります。</span>`;
                console.error(error);
                chatHistory.pop();
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
