<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini (API動作版)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #FFFFFF; 
            color: #1f1f1f; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        header {
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 500;
            color: #1f1f1f;
            border-bottom: 1px solid #f0f0f0; 
        }
        #chat-box { 
            flex: 1; 
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px; 
            overflow-y: auto; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .msg { 
            margin: 15px 0; 
            padding: 12px 18px; 
            border-radius: 18px; 
            max-width: 85%; 
            line-height: 1.6;
            font-size: 15px;
        }
        .user { 
            background: #f0f4f9; 
            color: #1f1f1f;
            align-self: flex-end; 
            margin-left: auto; 
            border-bottom-right-radius: 4px;
            white-space: pre-wrap; 
        }
        .ai { 
            background: transparent; 
            align-self: flex-start; 
            padding-left: 40px;
            position: relative;
        }
        .ai::before {
            content: "";
            position: absolute;
            left: 10px;
            top: 12px;
            font-size: 18px;
        }
        .ai p { margin: 0 0 10px 0; }
        .ai p:last-child { margin-bottom: 0; }
        .ai ul, .ai ol { margin: 5px 0; padding-left: 20px; }
        .ai li { margin: 5px 0; }
        .ai strong { color: #000; font-weight: 600; }
        .ai code { background: #f0f2f5; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .input-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 25px 20px;
            box-sizing: border-box;
        }
        #input-area { 
            display: flex; 
            align-items: center;
            background: #f0f2f5; 
            border-radius: 28px;
            padding: 6px 16px;
            border: 1px solid transparent;
        }
        #input-area:focus-within {
            background: #eaf0f6; 
        }
        input { 
            flex: 1; 
            background: transparent;
            border: none;
            color: #1f1f1f;
            padding: 12px; 
            font-size: 16px;
            outline: none;
        }
        input::placeholder {
            color: #757575;
        }
        button { 
            background: transparent;
            border: none;
            color: #1a73e8; 
            font-size: 20px;
            cursor: pointer; 
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover {
            background: #e1e4e8;
        }
    </style>
    <!-- 🌟 ブラウザのバグを防ぐため、一番安全な「</style>のすぐ下」に配置しました -->
    <script src="marked.min.js"></script>
</head>
<body>
    <header> Gemini</header>
    <div id="chat-box">
        <div class="msg ai"><b>Gemini:</b> 今日はどのような用件でしょうか？</div>
    </div>
    <div class="input-container">
        <div id="input-area">
            <input type="text" id="user-input" placeholder="ここにプロンプトを入力してください" onkeypress="if(event.key==='Enter') sendToGemini()">
            <button onclick="sendToGemini()">➤</button>
        </div>
    </div>
    <script>
        let API_KEY = window.sessionStorage.getItem('gemini_key');
        if (!API_KEY) {
            API_KEY = prompt("Gemini APIキーを入力してください：");
            if (API_KEY) {
                window.sessionStorage.setItem('gemini_key', API_KEY);
            }
        }
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=" + API_KEY;
        let chatHistory = [];
        async function sendToGemini() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const promptValue = inputField.value.trim();
            if (!promptValue) return;
            chatBox.innerHTML += '<div class="msg user">' + promptValue + '</div>';
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            const aiMsgId = 'ai-' + Date.now();
            chatBox.innerHTML += '<div class="msg ai" id="' + aiMsgId + '">考え中...</div>';
            chatBox.scrollTop = chatBox.scrollHeight;
            chatHistory.push({
                role: "user",
                parts: [{ text: promptValue }]
            });
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chatHistory
                    })
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error("APIエラー: " + response.status + " - " + errorText);
                }
                const data = await response.json();
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                    const reply = data.candidates[0].content.parts[0].text;
                    // 🌟 読み込んだ marked.min.js を使ってマークダウン変換
                    document.getElementById(aiMsgId).innerHTML = marked.parse(reply);
                    chatHistory.push({
                        role: "model",
                        parts: [{ text: reply }]
                    });
                } else {
                    throw new Error("Googleから想定外のデータが返ってきました。");
                }
            } catch (error) {
                console.error("デバッグ用詳細:", error);
                document.getElementById(aiMsgId).innerHTML = '<span style="color: #ff4d4d;">エラー: ' + error.message + '</span>';
                chatHistory.pop();
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
