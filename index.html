<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <style>
                /* 全体の背景をいただいた画像の「真っ白」に変更 */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #FFFFFF; /* ✨ 送っていただいた純白の色です */
            color: #1f1f1f; /* 文字色は見やすい深いグレー */
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        
        /* ヘッダー */
        header {
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 500;
            color: #1f1f1f;
            border-bottom: 1px solid #f0f0f0; /* 薄い境界線 */
        }

        /* チャット表示エリア */
        #chat-box { 
            flex: 1; 
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px; 
            overflow-y: auto; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* メッセージの枠 */
        .msg { 
            margin: 15px 0; 
            padding: 12px 18px; 
            border-radius: 18px; 
            max-width: 85%; 
            line-height: 1.6;
            font-size: 15px;
        }

        /* ユーザーの発言（右側・白背景に映える薄いグレーの吹き出し） */
        .user { 
            background: #f0f4f9; /* Googleっぽい爽やかな薄いブルーグレー */
            color: #1f1f1f;
            align-self: flex-end; 
            margin-left: auto; 
            border-bottom-right-radius: 4px;
        }

        /* Geminiの発言（左側・枠なし） */
        .ai { 
            background: transparent; 
            align-self: flex-start; 
            padding-left: 40px;
            position: relative;
        }

        /* Geminiのキラキラアイコン */
        .ai::before {
            content: "✨";
            position: absolute;
            left: 10px;
            top: 12px;
            font-size: 18px;
        }

        /* 入力エリアのコンテナ */
        .input-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 25px 20px;
            box-sizing: border-box;
        }

        /* 本物風の丸い入力ボックス（背景が白なので、少しグレーにして目立たせます） */
        #input-area { 
            display: flex; 
            align-items: center;
            background: #f0f2f5; /* ソフトな明るいグレー */
            border-radius: 28px;
            padding: 6px 16px;
            border: 1px solid transparent;
        }
        #input-area:focus-within {
            background: #eaf0f6; /* クリックした時に少し青みがかった色に */
        }

        /* 入力欄本体 */
        input { 
            flex: 1; 
            background: transparent;
            border: none;
            color: #1f1f1f;
            padding: 12px; 
            font-size: 16px;
            outline: none;
        }
        input::placeholder {
            color: #757575;
        }

        /* 送信ボタン（Googleブルー） */
        button { 
            background: transparent;
            border: none;
            color: #1a73e8; 
            font-size: 20px;
            cursor: pointer; 
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover {
            background: #e1e4e8;
        }

    </style>
</head>
<body>

    <header>✨ Gemini</header>
    <div id="chat-box">
        <!-- 最初のアナウンス -->
        <div class="msg ai"><b>Gemini:</b> 今日はどのような用件でしょうか？</div>
    </div>
    
    <div class="input-container">
        <div id="input-area">
            <input type="text" id="user-input" placeholder="ここにプロンプトを入力してください" onkeypress="if(event.key==='Enter') sendToGemini()">
            <button onclick="sendToGemini()">➤</button>
        </div>
    </div>

                <script>
        // 🔒 サイトを開いた時にポップアップでキーを入力させます
        let API_KEY = window.sessionStorage.getItem('gemini_key');
        
        if (!API_KEY) {
            API_KEY = prompt("Gemini APIキーを入力してください：");
            if (API_KEY) {
                window.sessionStorage.setItem('gemini_key', API_KEY);
            }
        }
        
        // ✨ 一番安定して繋がるドメインのフルURLです
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + API_KEY;

        let chatHistory = [];

        async function sendToGemini() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const promptValue = inputField.value.trim();
            
            if (!promptValue) return;

            // 1. ユーザーのメッセージを表示
            chatBox.innerHTML += '<div class="msg user">' + promptValue + '</div>';
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // AIの返答待ち表示
            const aiMsgId = 'ai-' + Date.now();
            chatBox.innerHTML += '<div class="msg ai" id="' + aiMsgId + '">考え中...</div>';
            chatBox.scrollTop = chatBox.scrollHeight;

            chatHistory.push({
                role: "user",
                parts: [{ text: promptValue }]
            });

            // 2. API送信
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chatHistory
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error("APIエラー: " + response.status + " - " + errorText);
                }

                const data = await response.json();
                
                // データ構造の存在チェックを行ってから文字を安全に抜き出します
                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                    const reply = data.candidates[0].content.parts[0].text;

                    // 3. 画面書き換え
                    document.getElementById(aiMsgId).innerHTML = reply.replace(/\n/g, '<br>');

                    // AIの返答を履歴に記憶させる
                    chatHistory.push({
                        role: "model",
                        parts: [{ text: reply }]
                    });
                } else {
                    throw new Error("Googleから想定外のデータが返ってきました。");
                }

            } catch (error) {
                console.error("デバッグ用詳細:", error);
                document.getElementById(aiMsgId).innerHTML = '<span style="color: #ff4d4d;">エラー: ' + error.message + '</span>';
                chatHistory.pop();
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
